name: Aggiorna La Voce Vesuviana

on:
  schedule:
    # Le esecuzioni programmate su GitHub sono "quando riesco", non puntuali:
    # vengono rimandate o saltate quando i loro computer sono carichi. Chiedendo
    # ogni venti minuti, anche se ne saltano molte ne passa comunque qualcuna.
    #
    # I minuti sono scelti apposta fuori tondo: allo scoccare dell'ora, e a meta'
    # e a un terzo di ora, si accalca mezzo mondo e le nostre richieste finivano
    # in coda dietro a tutte le altre. Sette, ventisette e quarantasette sono
    # momenti tranquilli, a parita' di tre passaggi ogni ora.
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:

# Una consegna a GitHub Pages per volta. Se due esecuzioni arrivano insieme
# al passaggio finale, una delle due viene respinta e il sito resta indietro
# pur essendo stato costruito: e' quello che e' successo il 24 novembre. Con
# questo accorgimento la seconda aspetta il proprio turno invece di fallire.
concurrency:
  group: pagine
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Raccogli le fonti
        run: python ingest.py

      - name: Genera il sito
        run: python build.py

      - name: Pubblica su Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN:   ${{ secrets.FB_TOKEN }}
          SITO_URL:   ${{ vars.SITO_URL }}
        run: python facebook.py

      - name: Salva lo stato
        run: |
          git config user.name  "La Voce Vesuviana (bot)"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "aggiornamento fonti $(date +'%d/%m %H:%M')"
          # Se nel frattempo su GitHub e' arrivato dell'altro - un articolo
          # nuovo, oppure un'altra esecuzione che ha gia' salvato le fonti -
          # il nostro invio viene respinto e tutto si ferma, consegna del sito
          # compresa. E' quello che e' successo il 24 novembre. Invece di
          # arrenderci, riprendiamo il lavoro altrui e riproviamo.
          for tentativo in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Tentativo $tentativo non riuscito, riprovo."
            sleep 5
          done
          echo "Non sono riuscito a salvare le fonti dopo tre tentativi." >&2
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
